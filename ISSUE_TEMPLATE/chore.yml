name: Chore
description: Maintenance, docs, refactoring, tests, CI or dependencies.
title: "chore(<scope>): <short description>"
labels: ["type:chore", "status:proposed", "priority:normal"]
body:
  - type: textarea
    id: context
    attributes: {label: Context, description: "What exists today and what is missing."}
    validations: {required: true}
  - type: textarea
    id: goal
    attributes: {label: Goal, description: "What will be true when this is done."}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance criteria, description: "Checkable statements, one per line.", value: "- [ ] "}
    validations: {required: true}
  - type: input
    id: area
    attributes: {label: Area, description: "Paths, modules or screens it touches."}
    validations: {required: true}
  - type: dropdown
    id: risk
    attributes: {label: Risk, options: ["Low: no sensitive path", "Touches a sensitive path (CODEOWNERS)"]}
    validations: {required: true}
  - type: textarea
    id: links
    attributes: {label: Links, description: "Plans, notes, conversations, related issues."}
  - type: dropdown
    id: source
    attributes: {label: Source, options: ["Owner's request", "Found by the agent"]}
    validations: {required: true}
